services:
  - type: web
    name: royal-dutch-backend
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Royal Dutch Medical Centre API
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_V1_PREFIX
        value: /api/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_SSL_CA_PATH
        sync: false
      - key: DATABASE_SSL_VERIFY_IDENTITY
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Royal Dutch Medical Centre
      - key: SMTP_USE_SSL
        value: true
